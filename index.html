<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⚡ Pokémon Sortie</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f2f4f8;color:#222}
header{background:linear-gradient(135deg,#e3350d,#ffcb05);color:#fff;padding:18px 14px;text-align:center}
header h1{margin:0;font-size:26px;text-shadow:0 2px 3px rgba(0,0,0,.3)}
header .maj{font-size:13px;opacity:.95;margin-top:4px}
#prochaine{display:inline-block;margin-top:8px;background:#fff;color:#e3350d;font-weight:bold;border-radius:20px;padding:4px 12px;font-size:14px}
#bandeau{display:none;background:#2a75bb;color:#fff;text-align:center;padding:8px;font-weight:bold}
nav{display:flex;background:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 4px rgba(0,0,0,.1)}
nav button{flex:1;border:none;background:none;padding:12px 4px;font-size:15px;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{border-color:#e3350d;color:#e3350d;font-weight:bold}
main{max-width:900px;margin:auto;padding:12px}
.filtres{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filtres input[type=search],.filtres select{flex:1;min-width:140px;padding:9px;border:1px solid #ccc;border-radius:8px;font-size:15px}
.filtres label{display:flex;align-items:center;gap:5px;font-size:14px}
h2{font-size:19px;margin:18px 0 10px}
h2.mois{text-transform:capitalize;color:#2a75bb;border-bottom:2px solid #2a75bb;padding-bottom:4px}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.carte{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.1);display:flex;flex-direction:column}
.corps{padding:10px 12px 12px}
.photo{position:relative;height:200px;background:#fff;border-bottom:1px solid #eee}
a.ph{height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#2a75bb;background:#fafafa}
a.ph span{font-size:60px}
a.ph small{margin-top:6px;font-weight:bold}
.photo.aphoto a.ph{display:none}
.photo:not(.aphoto) .galerie{display:none}
.galerie{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:200px;scrollbar-width:none}
.galerie::-webkit-scrollbar{display:none}
.galerie a{flex:0 0 100%;scroll-snap-align:start;display:none;height:200px}
.galerie a.ok{display:flex;align-items:center;justify-content:center}
.galerie img{max-width:100%;max-height:200px;object-fit:contain}
.fl{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border:none;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:26px;line-height:38px;padding:0;cursor:pointer;z-index:5;display:none}
.fl.g{left:6px}.fl.d{right:6px}
.photo.multi .fl{display:block}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.b{font-size:11px;font-weight:bold;padding:3px 7px;border-radius:10px;background:#eee}
.b.neuf{background:#e3350d;color:#fff}
.b.t{background:#2a75bb;color:#fff}
.b.j{background:#ffcb05;color:#333}
.b.s-confirme{background:#d4f5d4;color:#1a7a1a}
.b.s-annonce{background:#fff0c2;color:#8a6500}
.b.s-rumeur{background:#f3d6f5;color:#7a1a80}
.carte h3{margin:4px 0;font-size:17px}
.date{font-weight:bold;color:#e3350d}
.serie{font-size:13px;color:#666}
.prix{margin:6px 0;font-size:16px;font-weight:bold}
.prix small{font-weight:normal;color:#888}
.desc{font-size:14px;margin:6px 0;color:#444}
details{margin:8px 0;background:#f6f8fb;border-radius:8px;padding:6px 8px}
summary{cursor:pointer;font-weight:bold}
.mags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mags a{font-size:13px;background:#fff;border:1px solid #ccd;border-radius:6px;padding:4px 7px;text-decoration:none;color:#2a75bb}
.btns{display:flex;gap:6px;margin-top:auto}
.btn{flex:1;text-align:center;font-size:13px;padding:8px 4px;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer;text-decoration:none;color:#222}
.btn.on{background:#ffcb05;border-color:#e0b000;font-weight:bold}
.vide{text-align:center;color:#777;padding:30px}
.mag{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.mag a{color:#2a75bb;font-weight:bold;text-decoration:none}
.mag p{margin:4px 0 0;font-size:14px;color:#555}
footer{text-align:center;font-size:12px;color:#888;padding:20px}
</style>
</head>
<body>

<header>
  <h1>⚡ Pokémon Sortie</h1>
  <div class="maj">Mis à jour le <span id="maj"></span></div>
  <div id="prochaine"></div>
</header>
<div id="bandeau"></div>

<nav>
  <button data-o="cal" class="on">📅 Calendrier</button>
  <button data-o="fav">⭐ Ma liste</button>
  <button data-o="mag">🛒 Magasins</button>
  <button data-o="compte" id="ongletCompte" style="display:none">👤 Compte</button>
</nav>

<main>
  <div class="filtres" id="filtres">
    <input type="search" id="q" placeholder="🔍 Rechercher…">
    <select id="fType">
      <option value="">Tous les types</option>
      <option value="extension">Extension</option>
      <option value="coffret">Coffret</option>
      <option value="deck">Deck</option>
      <option value="evenement">Événement</option>
      <option value="rumeur">Rumeur</option>
    </select>
    <select id="fMag"><option value="">Tous les magasins</option></select>
    <label><input type="checkbox" id="fPasse"> Sorties passées</label>
  </div>
  <div id="contenu"></div>
</main>

<footer>Site de fan non officiel. Prix conseillés indicatifs, à vérifier en magasin.</footer>

<script>
const MISE_A_JOUR = "9 octobre 2026";

const MAGASINS = {
  fnac:{nom:"Fnac",site:"fnac.com",url:"https://www.fnac.com",info:"Magasins et site, précommandes fréquentes."},
  cultura:{nom:"Cultura",site:"cultura.com",url:"https://www.cultura.com",info:"Bon rayon cartes, retrait en magasin."},
  micromania:{nom:"Micromania",site:"micromania.fr",url:"https://www.micromania.fr",info:"Précommandes et exclusivités."},
  leclerc:{nom:"E.Leclerc",site:"e.leclerc",url:"https://www.e.leclerc",info:"Rayon jouets / espace culturel."},
  carrefour:{nom:"Carrefour",site:"carrefour.fr",url:"https://www.carrefour.fr",info:"Boosters et coffrets en rayon jouets."},
  auchan:{nom:"Auchan",site:"auchan.fr",url:"https://www.auchan.fr",info:"Rayon jouets."},
  kingjouet:{nom:"King Jouet",site:"king-jouet.com",url:"https://www.king-jouet.com",info:"Magasins de jouets."},
  joueclub:{nom:"JouéClub",site:"joueclub.fr",url:"https://www.joueclub.fr",info:"Magasins de jouets."},
  amazon:{nom:"Amazon",site:"amazon.fr",url:"https://www.amazon.fr",info:"Attention aux prix des revendeurs."},
  cdiscount:{nom:"Cdiscount",site:"cdiscount.com",url:"https://www.cdiscount.com",info:"Vérifie le vendeur."},
  pokemoncenter:{nom:"Pokémon Center",site:"pokemoncenter.com",url:"https://www.pokemoncenter.com/fr-fr",info:"Boutique officielle."},
  philibert:{nom:"Philibert",site:"philibertnet.com",url:"https://www.philibertnet.com",info:"Spécialiste jeux, displays."},
  ultrajeux:{nom:"UltraJeux",site:"ultrajeux.com",url:"https://www.ultrajeux.com",info:"Spécialiste cartes à jouer."},
  boutiques:{nom:"Boutiques spécialisées",site:"",url:"https://www.google.com/maps/search/boutique+cartes+pokemon",info:"Boutiques de jeux près de chez toi (avant-premières)."}
};
const GRAND_PUBLIC=["fnac","cultura","micromania","leclerc","carrefour","auchan","kingjouet","joueclub","amazon","cdiscount"];
const DISPLAYS=["philibert","ultrajeux","boutiques","micromania","cultura","amazon"];
const PREMIUM=["pokemoncenter","fnac","micromania","cultura","philibert","ultrajeux","amazon","boutiques"];

const PRODUITS = [
{id:"pokebox30",nom:"Pokébox 30e anniversaire",recherche:"pokébox 30e anniversaire pokemon fr",serie:"30e anniversaire",type:"coffret",date:"2026-10-16",prix:"25,99",prixTbc:false,statut:"confirme",ajout:"2026-09-25",desc:"Pokébox de la vague 30e anniversaire avec boosters et carte promo.",magasins:GRAND_PUBLIC},
{id:"classeur30",nom:"Classeur collector 30e anniversaire",recherche:"classeur collector 30e anniversaire pokemon",serie:"30e anniversaire",type:"coffret",date:"2026-10-23",prix:"45,99",prixTbc:false,statut:"annonce",ajout:"2026-09-25",desc:"Classeur avec boosters. La date pourrait passer au 4 décembre.",magasins:GRAND_PUBLIC},
{id:"avp-me06",nom:"Avant-premières Méga-Évolution 06",recherche:"avant-première pokemon ME06 kit",serie:"Méga-Évolution",type:"evenement",date:"2026-10-24",fin:"2026-11-01",dateTxt:"du 24 octobre au 1er novembre 2026",prix:"30",prixTbc:true,statut:"confirme",ajout:"2026-10-01",desc:"Tournois d'avant-première en boutique : joue et repars avec des boosters de la nouvelle extension.",magasins:["boutiques","ultrajeux","philibert"]},
{id:"deck-mentali",nom:"Deck Mentali-ex",recherche:"deck mentali ex pokemon jcc",serie:"Méga-Évolution",type:"deck",date:"2026-10-30",prix:"24,99",prixTbc:false,statut:"confirme",ajout:"2026-10-01",desc:"Deck prêt à jouer autour de Mentali-ex.",magasins:GRAND_PUBLIC},
{id:"deck-noctali",nom:"Deck Noctali-ex",recherche:"deck noctali ex pokemon jcc",serie:"Méga-Évolution",type:"deck",date:"2026-10-30",prix:"24,99",prixTbc:false,statut:"confirme",ajout:"2026-10-01",desc:"Deck prêt à jouer autour de Noctali-ex.",magasins:GRAND_PUBLIC},
{id:"creation-deck",nom:"Coffret Création de deck",recherche:"coffret création de deck pokemon",serie:"Méga-Évolution",type:"coffret",date:"2026-10-31",dateTxt:"fin octobre 2026",prix:"",prixTbc:true,statut:"annonce",ajout:"2026-10-01",desc:"Coffret pour construire ton propre deck.",magasins:GRAND_PUBLIC},
{id:"me06-booster",nom:"ME06 – Booster",recherche:"booster pokemon ME06 français",serie:"Méga-Évolution 06",type:"extension",date:"2026-11-06",prix:"5,99",prixTbc:false,statut:"confirme",ajout:"2026-10-01",desc:"Booster à l'unité de la nouvelle extension.",magasins:GRAND_PUBLIC},
{id:"me06-tripack",nom:"ME06 – Tri-pack",recherche:"tripack pokemon ME06",serie:"Méga-Évolution 06",type:"extension",date:"2026-11-06",prix:"17,99",prixTbc:false,statut:"confirme",ajout:"2026-10-01",desc:"3 boosters et une carte promo.",magasins:GRAND_PUBLIC},
{id:"me06-bundle",nom:"ME06 – Bundle 6 boosters",recherche:"bundle 6 boosters pokemon ME06",serie:"Méga-Évolution 06",type:"extension",date:"2026-11-06",prix:"35,99",prixTbc:false,statut:"confirme",ajout:"2026-10-01",desc:"Lot de 6 boosters.",magasins:GRAND_PUBLIC},
{id:"me06-etb",nom:"ME06 – Coffret Dresseur d'Élite",recherche:"coffret dresseur d'élite pokemon ME06",serie:"Méga-Évolution 06",type:"coffret",date:"2026-11-06",prix:"55,99",prixTbc:false,statut:"confirme",ajout:"2026-10-01",desc:"Boosters, accessoires et carte promo.",magasins:GRAND_PUBLIC},
{id:"me06-demi",nom:"ME06 – Demi-display (18 boosters)",recherche:"demi display pokemon ME06",serie:"Méga-Évolution 06",type:"extension",date:"2026-11-06",prix:"107,82",prixTbc:false,statut:"confirme",ajout:"2026-10-01",desc:"Boîte de 18 boosters.",magasins:DISPLAYS},
{id:"me06-display",nom:"ME06 – Display (36 boosters)",recherche:"display 36 boosters pokemon ME06",serie:"Méga-Évolution 06",type:"extension",date:"2026-11-06",prix:"215,64",prixTbc:false,statut:"confirme",ajout:"2026-10-01",desc:"Boîte complète de 36 boosters.",magasins:DISPLAYS},
{id:"me06-blisters",nom:"ME06 – Blisters",recherche:"blister pokemon ME06",serie:"Méga-Évolution 06",type:"extension",date:"2026-11-06",prix:"",prixTbc:true,statut:"confirme",ajout:"2026-10-01",desc:"Boosters sous blister avec carte promo.",magasins:GRAND_PUBLIC},
{id:"upc-journee",nom:"Ultra-Premium Collection – Journée",recherche:"ultra premium collection pokemon journée",serie:"Méga-Évolution",type:"coffret",date:"2026-11-06",prix:"229,99",prixTbc:false,statut:"confirme",ajout:"2026-10-01",desc:"Grand coffret collector, version Journée.",magasins:PREMIUM},
{id:"upc-soiree",nom:"Ultra-Premium Collection – Soirée",recherche:"ultra premium collection pokemon soirée",serie:"Méga-Évolution",type:"coffret",date:"2026-11-06",prix:"229,99",prixTbc:false,statut:"confirme",ajout:"2026-10-01",desc:"Grand coffret collector, version Soirée.",magasins:PREMIUM},
{id:"metamorph",nom:"Coffret Métamorph",recherche:"coffret métamorph pokemon",serie:"Méga-Évolution",type:"coffret",date:"2026-11-06",prix:"49,99",prixTbc:false,statut:"confirme",ajout:"2026-10-01",desc:"Coffret autour de Métamorph.",magasins:GRAND_PUBLIC},
{id:"figurines",nom:"Coffret figurines",recherche:"coffret figurine pokemon jcc",serie:"Méga-Évolution",type:"coffret",date:"2026-11-06",prix:"37,99",prixTbc:false,statut:"confirme",ajout:"2026-10-01",desc:"Coffret avec figurine et boosters.",magasins:GRAND_PUBLIC},
{id:"autocollant-lucario",nom:"Coffret autocollants Lucario",recherche:"coffret autocollants lucario pokemon",serie:"Méga-Évolution",type:"coffret",date:"2026-11-13",prix:"19,99",prixTbc:false,statut:"confirme",ajout:"2026-10-09",desc:"Autocollants et boosters, thème Lucario.",magasins:GRAND_PUBLIC},
{id:"autocollant-noadkoko",nom:"Coffret autocollants Noadkoko",recherche:"coffret autocollants noadkoko pokemon",serie:"Méga-Évolution",type:"coffret",date:"2026-11-13",prix:"19,99",prixTbc:false,statut:"confirme",ajout:"2026-10-09",desc:"Autocollants et boosters, thème Noadkoko.",magasins:GRAND_PUBLIC},
{id:"ligue-amphinobi",nom:"Deck Combat de Ligue Amphinobi",recherche:"deck combat de ligue amphinobi",serie:"Méga-Évolution",type:"deck",date:"2026-11-13",prix:"",prixTbc:true,statut:"confirme",ajout:"2026-10-09",desc:"Deck compétitif prêt à jouer.",magasins:PREMIUM},
{id:"vague30-dec",nom:"Produits 30e anniversaire (décembre)",recherche:"pokemon 30e anniversaire coffret décembre",serie:"30e anniversaire",type:"coffret",date:"2026-12-04",prix:"",prixTbc:true,statut:"annonce",ajout:"2026-10-09",desc:"Nouvelle vague de produits du 30e anniversaire.",magasins:GRAND_PUBLIC},
{id:"ex-star",nom:"Extension spéciale (rumeur)",recherche:"pokemon jcc rumeur 2027 extension",serie:"?",type:"rumeur",date:"2027-04-01",dateTxt:"printemps 2027 (rumeur)",prix:"",prixTbc:true,statut:"rumeur",ajout:"2026-10-09",desc:"Rumeur non confirmée par Pokémon.",magasins:GRAND_PUBLIC}
];

const TYPES={extension:"Extension",coffret:"Coffret",deck:"Deck",evenement:"Événement",rumeur:"Rumeur"};
const EMOJI={extension:"🃏",coffret:"🎁",deck:"⚔️",evenement:"🏆",rumeur:"❓"};
const STATUTS={confirme:"Confirmé",annonce:"Annoncé",rumeur:"Rumeur"};

let favs=JSON.parse(localStorage.getItem("pkm-fav")||"[]");
let onglet="cal";
const auj=new Date();auj.setHours(0,0,0,0);

function jours(d){return Math.round((new Date(d+"T00:00:00")-auj)/864e5)}
function chrono(a,b){return a.date.localeCompare(b.date)}
function estNeuf(p){return p.ajout && (auj-new Date(p.ajout+"T00:00:00"))/864e5<14}
function passe(p){return jours(p.fin||p.date)<0}
function dateTxt(p){return p.dateTxt||new Date(p.date+"T00:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
const enc=encodeURIComponent;

/* ---------- Photos ---------- */
function photo(p){
  let s="";
  ["","-2","-3","-4"].forEach(x=>{
    s+=`<a target="_blank"><img src="${p.id}${x}.jpg" data-b="${p.id}${x}" data-e="0" onload="imgOk(this)" onerror="imgErr(this)" alt=""></a>`;
  });
  return `<div class="photo">
    <a class="ph" target="_blank" href="https://www.google.com/search?tbm=isch&q=${enc(p.recherche)}"><span>${EMOJI[p.type]}</span><small>👆 Voir à quoi ça ressemble</small></a>
    <div class="galerie">${s}</div>
    <button type="button" class="fl g" onclick="fleche(this,-1)">‹</button>
    <button type="button" class="fl d" onclick="fleche(this,1)">›</button>
  </div>`;
}
function imgOk(el){el.parentNode.classList.add("ok");el.parentNode.href=el.src;majPhoto(el.closest(".photo"))}
function imgErr(el){
  const E=["jpg","png","webp","jpeg"];let e=+el.dataset.e+1;
  if(e<E.length){el.dataset.e=e;el.src=el.dataset.b+"."+E[e]}
  else{const box=el.closest(".photo");el.parentNode.remove();if(box)majPhoto(box)}
}
function majPhoto(box){
  if(!box)return;
  const n=box.querySelectorAll(".galerie a.ok").length;
  box.classList.toggle("aphoto",n>0);
  box.classList.toggle("multi",n>1);
}
function fleche(b,d){
  const g=b.parentNode.querySelector(".galerie");
  const n=g.querySelectorAll("a.ok").length;if(n<2)return;
  const w=g.clientWidth;let i=Math.round(g.scrollLeft/w);
  i=(i+d+n)%n;
  g.scrollTo({left:i*w,behavior:"smooth"});
}

/* ---------- Carte ---------- */
function lienMag(p){return k=>{
  const m=MAGASINS[k];if(!m)return"";
  const url=m.site?`https://www.google.com/search?q=${enc(p.recherche+" site:"+m.site)}`:m.url;
  return `<a target="_blank" href="${url}">${m.nom}</a>`;
}}
function carte(p){
  const j=jours(p.date),fav=favs.includes(p.id);
  return `<div class="carte">${photo(p)}<div class="corps">
  <div class="badges">${estNeuf(p)?'<span class="b neuf">NOUVEAU</span>':''}<span class="b t">${TYPES[p.type]}</span><span class="b s-${p.statut}">${STATUTS[p.statut]}</span>${j>=0&&p.type!="rumeur"?`<span class="b j">${j==0?"Aujourd'hui !":"J-"+j}</span>`:''}</div>
  <h3>${p.nom}</h3>
  <div class="date">📅 ${dateTxt(p)}</div>
  <div class="serie">${p.serie}</div>
  <div class="prix">💶 ${p.prix?p.prix+" €":"Prix inconnu"}${p.prixTbc?" <small>(à confirmer)</small>":""}</div>
  <p class="desc">${p.desc}</p>
  <details><summary>🛒 Où l'acheter</summary><div class="mags">${p.magasins.map(lienMag(p)).join("")}</div></details>
  <div class="btns">
    <a class="btn" target="_blank" href="https://www.google.com/search?tbm=isch&q=${enc(p.recherche)}">🖼️ Photos</a>
    <button class="btn" onclick="agenda('${p.id}')">📆 Agenda</button>
    <button class="btn ${fav?"on":""}" onclick="suivre('${p.id}')">${fav?"★ Suivi":"☆ Suivre"}</button>
  </div></div></div>`;
}

/* ---------- Actions ---------- */
function suivre(id){
  favs=favs.includes(id)?favs.filter(x=>x!=id):[...favs,id];
  localStorage.setItem("pkm-fav",JSON.stringify(favs));
  if(window.syncFavs)window.syncFavs(favs);
  rendre();
}
function setFavs(a){favs=a;localStorage.setItem("pkm-fav",JSON.stringify(favs));rendre()}
function agenda(id){
  const p=PRODUITS.find(x=>x.id==id);
  const d=p.date.replace(/-/g,""),f=new Date(p.date+"T00:00:00");f.setDate(f.getDate()+1);
  const d2=f.toISOString().slice(0,10).replace(/-/g,"");
  const ics=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Pokemon Sortie//FR\r\nBEGIN:VEVENT\r\nUID:${p.id}@pokemon-sortie\r\nDTSTAMP:${d}T000000Z\r\nDTSTART;VALUE=DATE:${d}\r\nDTEND;VALUE=DATE:${d2}\r\nSUMMARY:Sortie Pokémon : ${p.nom}\r\nDESCRIPTION:${p.prix?p.prix+" €":""}\r\nEND:VEVENT\r\nEND:VCALENDAR`;
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));
  a.download=p.id+".ics";a.click();
}

/* ---------- Affichage ---------- */
function filtrer(l){
  const q=document.getElementById("q").value.toLowerCase().trim();
  const t=document.getElementById("fType").value;
  const m=document.getElementById("fMag").value;
  const vp=document.getElementById("fPasse").checked;
  return l.filter(p=>(!q||(p.nom+" "+p.serie+" "+p.desc).toLowerCase().includes(q))&&(!t||p.type==t)&&(!m||p.magasins.includes(m))&&(vp||!passe(p)));
}
function grille(l){return `<div class="grille">${l.map(carte).join("")}</div>`}
function rendre(){
  const c=document.getElementById("contenu");
  document.getElementById("filtres").style.display=(onglet=="cal"||onglet=="fav")?"flex":"none";
  if(onglet=="cal"){
    const l=filtrer(PRODUITS).sort(chrono);
    if(!l.length){c.innerHTML='<div class="vide">Aucun produit trouvé.</div>';return}
    let h="";
    const n=l.filter(estNeuf);
    if(n.length)h+=`<h2>🆕 Nouveautés (par date de sortie)</h2>${grille(n)}`;
    h+=`<h2>📅 Toutes les sorties</h2>`;
    const mois={};
    l.forEach(p=>{const k=p.date.slice(0,7);(mois[k]=mois[k]||[]).push(p)});
    Object.keys(mois).sort().forEach(k=>{
      const nom=new Date(k+"-01T00:00:00").toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
      h+=`<h2 class="mois">${nom}</h2>${grille(mois[k])}`;
    });
    c.innerHTML=h;
  }else if(onglet=="fav"){
    const l=filtrer(PRODUITS.filter(p=>favs.includes(p.id))).sort(chrono);
    c.innerHTML=l.length?`<h2>⭐ Ma liste</h2>${grille(l)}`:'<div class="vide">Ta liste est vide.<br>Clique sur ☆ Suivre sur un produit.</div>';
  }else if(onglet=="mag"){
    c.innerHTML="<h2>🛒 Où acheter des cartes Pokémon</h2>"+Object.values(MAGASINS).map(m=>`<div class="mag"><a target="_blank" href="${m.url}">${m.nom}</a><p>${m.info}</p></div>`).join("");
  }else if(onglet=="compte"){
    c.innerHTML='<div id="zoneCompte" class="vide">Chargement…</div>';
    if(window.afficherCompte)window.afficherCompte();
  }
}

/* ---------- Démarrage ---------- */
document.getElementById("maj").textContent=MISE_A_JOUR;
(function(){
  const p=PRODUITS.filter(p=>p.type!="rumeur"&&jours(p.date)>=0).sort(chrono)[0];
  const e=document.getElementById("prochaine");
  if(p){const j=jours(p.date);e.textContent=`Prochaine sortie : ${j==0?"aujourd'hui !":"J-"+j}`}else e.style.display="none";
})();
(function(){
  const der=localStorage.getItem("pkm-visite");
  if(der){
    const n=PRODUITS.filter(p=>p.ajout&&new Date(p.ajout+"T23:59:59")>new Date(+der)).length;
    if(n){const b=document.getElementById("bandeau");b.textContent=`🎉 ${n} nouveau${n>1?"x":""} produit${n>1?"s":""} depuis ta dernière visite`;b.style.display="block"}
  }
  localStorage.setItem("pkm-visite",Date.now());
})();
const fMag=document.getElementById("fMag");
Object.entries(MAGASINS).forEach(([k,m])=>fMag.innerHTML+=`<option value="${k}">${m.nom}</option>`);
["q","fType","fMag","fPasse"].forEach(id=>document.getElementById(id).addEventListener("input",rendre));
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");onglet=b.dataset.o;rendre();
});
rendre();
</script>

<script type="module">
const FIREBASE_CONFIG = {apiKey:"",authDomain:"",projectId:"",appId:""};
if(FIREBASE_CONFIG.apiKey){
  const V="https://www.gstatic.com/firebasejs/10.12.0/";
  const {initializeApp}=await import(V+"firebase-app.js");
  const {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}=await import(V+"firebase-auth.js");
  const {getFirestore,doc,getDoc,setDoc}=await import(V+"firebase-firestore.js");
  const app=initializeApp(FIREBASE_CONFIG),auth=getAuth(app),db=getFirestore(app);
  let user=null;
  document.getElementById("ongletCompte").style.display="";
  window.syncFavs=f=>{if(user)setDoc(doc(db,"users",user.uid),{favs:f})};
  window.afficherCompte=()=>{
    const z=document.getElementById("zoneCompte");if(!z)return;
    if(user){z.innerHTML=`Connecté : <b>${user.email}</b><br><br><button class="btn" id="deco">Se déconnecter</button>`;document.getElementById("deco").onclick=()=>signOut(auth)}
    else{z.innerHTML=`<button class="btn" id="co">Se connecter avec Google</button>`;document.getElementById("co").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider())}
  };
  onAuthStateChanged(auth,async u=>{
    user=u;
    if(u){const s=await getDoc(doc(db,"users",u.uid));const f=s.exists()?s.data().favs||[]:[];const m=[...new Set([...f,...JSON.parse(localStorage.getItem("pkm-fav")||"[]")])];setFavs(m);window.syncFavs(m)}
    window.afficherCompte();
  });
}
</script>
